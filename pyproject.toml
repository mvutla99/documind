[project]
name = "documind"
version = "1.0.0"
description = "Ask questions about your documents and get cited answers (RAG with FastAPI + Gemini)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are intentional
